<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PrintBridge Agent</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>PrintBridge Agent</h1>
    <span class="pill" id="pill-estado">activo</span>
  </header>

  <section class="tarjeta" id="tarjeta-info">
    Cargando...
  </section>

  <section class="tarjeta">
    <h2>Impresoras configuradas</h2>
    <table>
      <thead><tr><th>Alias</th><th>Tipo</th><th>Destino</th><th>Estado</th><th></th></tr></thead>
      <tbody id="tbody-impresoras"></tbody>
    </table>
  </section>

  <section class="tarjeta">
    <h2>Agregar / actualizar impresora</h2>
    <form id="form-impresora">
      <label>Alias logico
        <input type="text" name="alias" placeholder="receipt, wristband, kitchen..." required>
      </label>

      <label>Tipo de conexion
        <select name="tipo" id="select-tipo">
          <option value="usb">USB / Local</option>
          <option value="red">Red (IP + puerto)</option>
        </select>
      </label>

      <div id="campos-usb">
        <label>Impresora detectada
          <select name="nombre_sistema" id="select-impresoras"></select>
        </label>
      </div>

      <div id="campos-red" style="display:none">
        <label>IP <input type="text" name="ip" placeholder="192.168.1.50"></label>
        <label>Puerto <input type="number" name="puerto" value="9100"></label>
      </div>

      <label>Formato de comandos
        <select name="formato_default">
          <option value="escpos">ESC/POS (recibos)</option>
          <option value="tspl">TSPL (TSC / brazaletes)</option>
          <option value="raw">RAW</option>
        </select>
      </label>

      <button type="submit">Guardar impresora</button>
    </form>
  </section>

  <footer>
    <button id="btn-carpeta">Abrir carpeta de datos</button>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
